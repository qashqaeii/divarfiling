<div class="crm-feat-field crm-feat-field--toggle crm-prop-bool-toggle">
    <div class="crm-feat-field-label">
        <i class="fas {{ icon }}" aria-hidden="true"></i>
        <span>{{ label }}</span>
    </div>
    <label class="crm-feat-toggle">
        {{ field }}
        <span class="crm-feat-toggle-ui" aria-hidden="true">
            <span class="crm-feat-toggle-knob"></span>
        </span>
        <span class="crm-feat-toggle-txt" data-feat-toggle-txt>{% if field.value %}دارد{% else %}ندارد{% endif %}</span>
    </label>
</div>
