<header class="mk-page-hero">
    <div class="mk-page-hero-main">
        <div class="mk-page-hero-kicker">
            <span class="mk-page-hero-mark" aria-hidden="true"></span>
            <span class="mk-page-hero-eyebrow">{{ eyebrow }}</span>
        </div>
        <h1 class="mk-page-hero-title">{{ title }}</h1>
        {% if desc %}<p class="mk-page-hero-desc">{{ desc }}</p>{% endif %}
    </div>
    {% if actions %}
    <div class="mk-page-hero-toolbar" role="toolbar" aria-label="عملیات صفحه">
        {% for action in actions %}
            {% if action.type == 'button' %}
            <button type="button"
                class="mk-hero-btn mk-hero-btn-{{ action.style|default:'ghost' }}"
                {% if action.modal %}data-modal-open="{{ action.modal }}"{% endif %}
                {% if action.drawer %}data-drawer-open="{{ action.drawer }}"{% endif %}
                {% if action.title %}title="{{ action.title }}"{% endif %}>
                {% if action.icon %}<i class="fas {{ action.icon }}" aria-hidden="true"></i>{% endif %}
                <span>{{ action.label }}</span>
            </button>
            {% else %}
            <a href="{{ action.url }}"
                class="mk-hero-btn mk-hero-btn-{{ action.style|default:'ghost' }}"
                {% if action.target %}target="{{ action.target }}"{% endif %}
                {% if action.title %}title="{{ action.title }}"{% endif %}>
                {% if action.icon %}<i class="fas {{ action.icon }}" aria-hidden="true"></i>{% endif %}
                <span>{{ action.label }}</span>
            </a>
            {% endif %}
        {% endfor %}
    </div>
    {% endif %}
</header>
