<nav class="wsh2-quick" aria-label="دسترسی‌های سریع" data-tour="workspace-shortcuts">
    <header class="wsh2-quick__head">
        <h2>دسترسی سریع</h2>
        <p>شروع کار بعدی</p>
    </header>
    <ul class="wsh2-quick__list">
        {% for action in home_quick_actions %}
        <li>
            <a href="{{ action.url }}" class="wsh2-quick__item" data-tone="{{ action.tone }}" title="{{ action.label }}"{% if action.is_anchor %} data-wsh2-anchor="1"{% endif %}>
                <span class="wsh2-quick__icon" aria-hidden="true"><i class="fas {{ action.icon }}"></i></span>
                <span class="wsh2-quick__label">{{ action.label }}</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>
