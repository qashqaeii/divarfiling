<nav class="agency-hub-nav agency-hub-nav--ref" aria-label="بخش‌های آژانس">
    <div class="agency-hub-nav__track">
        {% for key, label, url in hub_nav %}
        <a href="{{ url }}" class="agency-hub-nav__item{% if hub_section == key %} is-active{% endif %}">
            <span class="agency-hub-nav__icon" aria-hidden="true">
                {% if key == 'dashboard' %}<i class="fas fa-gauge-high"></i>
                {% elif key == 'advisors' %}<i class="fas fa-users"></i>
                {% elif key == 'licenses' %}<i class="fas fa-id-card"></i>
                {% elif key == 'activity' %}<i class="fas fa-clock-rotate-left"></i>
                {% elif key == 'settings' %}<i class="fas fa-gear"></i>
                {% endif %}
            </span>
            <span class="agency-hub-nav__label">{{ label }}</span>
        </a>
        {% endfor %}
    </div>
</nav>
