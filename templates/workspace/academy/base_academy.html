{% extends 'workspace/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'workspace/css/academy.css' %}?v=6">
<link rel="stylesheet" href="{% static 'css/mizkar-video-player.css' %}?v=2">
<link rel="stylesheet" href="{% static 'workspace/css/ws-academy-mobile-v2.css' %}?v=1">
<link rel="stylesheet" href="{% static 'workspace/css/ws-academy-mobile-v3.css' %}?v=1">
{% endblock %}

{% block mobile_bar_title %}آکادمی{% endblock %}

{% block content %}
<div class="acd-page acd-mobile--closure acd-page--{{ academy_section|default:'home' }}{% if academy_section == 'mission' %} acd-page--mission{% endif %}" id="acdPage">
    {% block academy_content %}{% endblock %}
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/bot-install-video.js' %}?v=1" defer></script>
<script src="{% static 'workspace/js/academy.js' %}?v=5"></script>
{% block academy_js %}{% endblock %}
{% endblock %}
