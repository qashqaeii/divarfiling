{% load static %}
{% if divar_contact_enabled %}
<div class="ws-modal ws-divar-connect-modal" id="divar-connect-modal" role="dialog" aria-modal="true"
     aria-labelledby="divar-connect-title" data-modal-uses-hidden hidden>
    <div class="ws-modal-overlay" data-modal-close tabindex="-1"></div>
    <div class="ws-modal-panel ws-modal-panel-sm ws-divar-connect-panel">
        <div class="ws-modal-head">
            <div>
                <h2 class="ws-modal-title" id="divar-connect-title">اتصال به دیوار</h2>
                <p class="ws-modal-sub">حساب دیوار خود را متصل کنید تا شمارهٔ تماس مالک آگهی را دریافت کنید.</p>
            </div>
            <button type="button" class="ws-modal-close" data-modal-close aria-label="بستن">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
        <div class="ws-modal-body">
            <p class="ws-form-error" data-divar-error hidden></p>
            <div data-divar-step="phone">
                <label class="mk-owner-box__label" for="divar-connect-phone">شماره موبایل حساب دیوار</label>
                <input type="tel" id="divar-connect-phone" class="ws-input ws-divar-connect-input" dir="ltr" inputmode="tel"
                       data-divar-phone data-divar-default-phone="{{ divar_connect_default_phone|default:'' }}"
                       value="{{ divar_connect_default_phone|default:'' }}"
                       placeholder="0912…" autocomplete="tel">
                <button type="button" class="ws-btn ws-btn-primary ws-btn-block ws-divar-modal-btn" data-divar-send-otp style="margin-top:0.75rem">
                    ارسال کد تأیید
                </button>
            </div>
            <div data-divar-step="otp" hidden>
                <div class="ws-divar-otp-label-row">
                    <label class="mk-owner-box__label" for="divar-connect-otp">کد پیامک‌شده</label>
                    <span class="ws-divar-otp-timer" data-divar-otp-timer hidden aria-live="polite"
                          title="مهلت ورود کد تأیید">
                        <i class="fas fa-clock" aria-hidden="true"></i>
                        <span data-divar-otp-timer-text dir="ltr">۰۲:۰۰</span>
                    </span>
                </div>
                <input type="text" id="divar-connect-otp" class="ws-input ws-divar-connect-input" dir="ltr" inputmode="numeric"
                       data-divar-otp maxlength="6" autocomplete="one-time-code">
                <p class="ws-divar-otp-expired-hint" data-divar-otp-expired hidden role="status">
                    مهلت ورود کد تمام شد. برای دریافت کد جدید، «ارسال مجدد کد» را بزنید.
                </p>
                <button type="button" class="ws-btn ws-btn-primary ws-btn-block ws-divar-modal-btn" data-divar-verify-otp style="margin-top:0.75rem">
                    تأیید و اتصال
                </button>
                <button type="button" class="ws-btn ws-btn-ghost ws-btn-block ws-divar-otp-resend" data-divar-otp-resend hidden>
                    ارسال مجدد کد
                </button>
            </div>
        </div>
    </div>
</div>
{% endif %}
