{% load static %}
{% if not customer_is_shared %}
<div class="crm-contact-hero__actions" role="toolbar" aria-label="عملیات مخاطب">
    <div class="crm-contact-hero__actions-primary">
        {% if customer.phone %}
        {% if ai_enabled and has_bot_license %}
        <button type="button" class="crm-dash-act crm-dash-act--ai" data-drawer-open="drawer-ai-message" title="ساخت پیام با هوش مصنوعی">
            <img src="{% static 'icons/Ai.png' %}" alt="" class="crm-dash-act__ai-icon" width="20" height="20" loading="lazy" decoding="async">
            <span>پیام هوشمند</span>
        </button>
        {% endif %}
        {% endif %}
        <button type="button" class="crm-dash-act crm-dash-act--primary" data-drawer-open="drawer-edit">
            <i class="fas fa-pen" aria-hidden="true"></i>
            <span>ویرایش</span>
        </button>
    </div>
    <div class="crm-contact-hero__actions-quick" aria-label="دسترسی سریع">
        {% if customer.phone %}
        <a href="https://wa.me/98{{ customer.phone|slice:'1:' }}" target="_blank" rel="noopener" class="crm-contact-hero__quick crm-contact-hero__quick--wa" title="واتساپ">
            <i class="fab fa-whatsapp" aria-hidden="true"></i>
            <span class="sr-only">واتساپ</span>
        </a>
        <a href="tel:{{ customer.phone }}" class="crm-contact-hero__quick" title="تماس">
            <i class="fas fa-phone" aria-hidden="true"></i>
            <span class="sr-only">تماس</span>
        </a>
        <button type="button" class="crm-contact-hero__quick" data-copy="{{ whatsapp_text }}" title="قالب پیام">
            <i class="fas fa-comment-dots" aria-hidden="true"></i>
            <span class="sr-only">قالب پیام</span>
        </button>
        <form method="post" class="crm-contact-hero__quick-form" title="ثبت تماس">
            {% csrf_token %}
            <input type="hidden" name="action" value="log_call">
            <button type="submit" class="crm-contact-hero__quick" title="تماس گرفتم">
                <i class="fas fa-phone-volume" aria-hidden="true"></i>
                <span class="sr-only">تماس گرفتم</span>
            </button>
        </form>
        {% endif %}
        <button type="button" class="crm-contact-hero__quick" data-drawer-open="drawer-activity" title="ثبت فعالیت">
            <i class="fas fa-plus" aria-hidden="true"></i>
            <span class="sr-only">فعالیت</span>
        </button>
    </div>
</div>
{% endif %}
