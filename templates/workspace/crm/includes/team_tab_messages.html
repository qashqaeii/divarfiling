{% if tab == 'messages' and agency_feature_messages %}
<section class="crm-msg-hub" data-crm-messages
    data-api-threads="{{ api_crm_team_messages_url }}"
    data-api-unread="{{ api_crm_team_messages_unread_url }}"
    data-api-members="{{ api_crm_team_messages_members_url }}"
    data-api-notifications="{{ api_crm_team_notifications_url }}"
    data-can-broadcast="{% if can_manage_team %}1{% else %}0{% endif %}"
    data-initial-thread="{{ request.GET.thread|default:'' }}"
    aria-label="صندوق پیام داخلی">

    <header class="crm-agency-tab-intro crm-msg-hub-intro">
        <div>
            <h2>صندوق پیام داخلی</h2>
            <p>ارتباط خصوصی و گروهی بین اعضای آژانس — بدون نیاز به آنلاین بودن</p>
        </div>
        <div class="crm-msg-hub-intro-actions">
            <button type="button" class="crm-dash-act" data-msg-notifications title="اعلان‌ها">
                <i class="fas fa-bell"></i>
                <span class="crm-msg-badge" data-msg-notif-count hidden>0</span>
            </button>
            <button type="button" class="crm-dash-act crm-dash-act--primary" data-msg-compose>
                <i class="fas fa-pen"></i><span>پیام جدید</span>
            </button>
        </div>
    </header>

    <div class="crm-msg-layout">
        <aside class="crm-msg-sidebar" aria-label="پوشه‌ها">
            <nav class="crm-msg-folders">
                <button type="button" class="crm-msg-folder active" data-folder="inbox">
                    <i class="fas fa-inbox"></i><span>صندوق ورودی</span>
                    <em data-folder-unread="inbox">0</em>
                </button>
                <button type="button" class="crm-msg-folder" data-folder="starred">
                    <i class="fas fa-star"></i><span>ستاره‌دار</span>
                </button>
                <button type="button" class="crm-msg-folder" data-folder="archived">
                    <i class="fas fa-box-archive"></i><span>آرشیو</span>
                </button>
            </nav>
            <p class="crm-msg-retention-hint">
                <i class="fas fa-clock-rotate-left"></i>
                پیام‌ها پس از ۳۰ روز خودکار حذف می‌شوند.
            </p>
        </aside>

        <div class="crm-msg-threads-panel">
            <div class="crm-msg-threads-head">
                <input type="search" class="crm-input crm-msg-search" placeholder="جستجو در موضوع..." data-msg-search dir="rtl">
            </div>
            <ul class="crm-msg-thread-list" data-msg-thread-list role="listbox" aria-label="لیست مکالمات">
                <li class="crm-msg-thread-empty">در حال بارگذاری...</li>
            </ul>
        </div>

        <div class="crm-msg-detail-panel" data-msg-detail hidden>
            <header class="crm-msg-detail-head">
                <div class="crm-msg-detail-meta">
                    <h3 data-msg-subject>—</h3>
                    <span data-msg-participants></span>
                </div>
                <div class="crm-msg-detail-actions">
                    <button type="button" class="crm-msg-icon-btn" data-msg-star title="ستاره"><i class="far fa-star"></i></button>
                    <button type="button" class="crm-msg-icon-btn" data-msg-archive title="آرشیو"><i class="fas fa-box-archive"></i></button>
                </div>
            </header>
            <div class="crm-msg-messages" data-msg-messages></div>
            <form class="crm-msg-reply-form" data-msg-reply-form>
                <textarea class="crm-input" name="body" rows="3" placeholder="پاسخ خود را بنویسید..." required></textarea>
                <div class="crm-msg-reply-toolbar">
                    <label class="crm-msg-attach-btn">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp" hidden>
                    </label>
                    <button type="submit" class="crm-btn crm-btn-primary crm-btn-sm">
                        <i class="fas fa-paper-plane"></i> ارسال
                    </button>
                </div>
            </form>
        </div>

        <div class="crm-msg-placeholder" data-msg-placeholder>
            <i class="fas fa-comments"></i>
            <p>یک مکالمه را انتخاب کنید یا پیام جدید بفرستید</p>
        </div>
    </div>
</section>
{% endif %}
