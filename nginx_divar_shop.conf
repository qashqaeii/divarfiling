# Nginx configuration for Divar Shop Django application
# Copy to: /etc/nginx/sites-available/divar_shop
#
# Adjust paths before deploy:
#   DJANGO_ROOT  — project root (contains staticfiles/ and media/)
#   Example: /var/www/divar_shop or /root/Django

upstream django {
    server 127.0.0.1:8000;
}

# --- HTTP: redirect domain traffic to HTTPS ---
server {
    listen 80;
    server_name divarfiling.ir www.divarfiling.ir;
    return 301 https://divarfiling.ir$request_uri;
}

# --- HTTP: direct IP access (no SSL redirect — matches SSLRedirectMiddleware) ---
server {
    listen 80;
    server_name 212.80.29.56;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/divar_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/divar_shop/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# --- HTTPS: primary site ---
server {
    listen 443 ssl http2;
    server_name divarfiling.ir www.divarfiling.ir;

    ssl_certificate /etc/letsencrypt/live/divarfiling.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divarfiling.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/divar_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/divar_shop/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location ~ ^/sitemap(-.*)?\.xml$ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
