# Nginx — HTTP only (قبل از SSL / certbot)
# Copy to: /etc/nginx/sites-available/divar_shop
#
# بعد از DNS:
#   certbot --nginx -d divarfiling.ir -d www.divarfiling.ir
# certbot خودش بلوک HTTPS را اضافه می‌کند.

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name divarfiling.ir www.divarfiling.ir 62.60.204.73;

    client_max_body_size 100M;

    location /static/ {
        alias /root/DivarFiling/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /root/DivarFiling/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ~ ^/sitemap(-.*)?\.xml$ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
