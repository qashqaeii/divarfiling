# Nginx — Adminer (مدیریت گرافیکی PostgreSQL)
# Copy to: /etc/nginx/sites-available/db_admin
#
# پیش‌نیاز:
#   1. docker compose -f docker-compose.db-admin.yml up -d
#   2. DNS: db.divarfiling.ir → IP سرور
#   3. ساخت رمز Basic Auth:
#        sudo apt install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/.htpasswd_dbadmin YOUR_USERNAME
#   4. SSL (در صورت نیاز):
#        sudo certbot --nginx -d db.divarfiling.ir
#
# فعال‌سازی:
#   sudo ln -s /etc/nginx/sites-available/db_admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream db_admin {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name db.divarfiling.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name db.divarfiling.ir;

    ssl_certificate /etc/letsencrypt/live/divarfiling.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divarfiling.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # محدودیت IP (اختیاری — IP خود را جایگزین کنید)
    # allow 1.2.3.4;
    # deny all;

    auth_basic "Database Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;

    location / {
        proxy_pass http://db_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
