{% load static %}
<div class="crm-drawer-head crm-drawer-head-property">
    <img
        class="crm-drawer-head-property__bg"
        src="{% static 'property_header.webp' %}"
        alt=""
        aria-hidden="true"
        decoding="async"
        width="1800"
        height="600"
    >
    <div class="crm-drawer-head-property__veil" aria-hidden="true"></div>
    <div class="crm-drawer-head-property__content">
        <h2>{{ head_title }}</h2>
        <p>{{ head_subtitle }}</p>
    </div>
    <button type="button" class="crm-drawer-close crm-drawer-close--on-accent" data-drawer-close aria-label="بستن">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>
</div>
