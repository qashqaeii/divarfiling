{% if tab == 'messages' and agency_feature_messages %}
{% load crm_tags %}
<section class="crm-msg-hub crm-msg-hub--studio" data-crm-messages
    data-api-threads="{{ api_crm_team_messages_url }}"
    data-api-unread="{{ api_crm_team_messages_unread_url }}"
    data-api-members="{{ api_crm_team_messages_members_url }}"
    data-api-notifications="{{ api_crm_team_notifications_url }}"
    data-can-broadcast="{% if can_manage_team %}1{% else %}0{% endif %}"
    data-can-manage="{% if can_manage_team %}1{% else %}0{% endif %}"
    data-initial-thread="{{ request.GET.thread|default:'' }}"
    aria-label="صندوق پیام داخلی">

    <header class="crm-msg-topbar">
        <div class="crm-msg-topbar-brand">
            <div class="crm-msg-topbar-mark" aria-hidden="true">
                <i class="fas fa-message"></i>
            </div>
            <div>
                <span class="crm-msg-topbar-kicker">Team Inbox</span>
                <h2 class="crm-msg-topbar-title">مرکز پیام تیم</h2>
            </div>
        </div>
        <div class="crm-msg-topbar-actions">
            <button type="button" class="crm-msg-pill crm-msg-pill--ghost" data-msg-notifications title="اعلان‌ها" aria-label="اعلان‌های تیم">
                <i class="fas fa-bell"></i>
                <span class="crm-msg-pill-badge" data-msg-notif-count hidden>0</span>
            </button>
            <button type="button" class="crm-msg-pill crm-msg-pill--accent" data-msg-compose>
                <span class="crm-msg-pill-glow" aria-hidden="true"></span>
                <i class="fas fa-pen-line"></i>
                <span>پیام جدید</span>
            </button>
        </div>
    </header>

    <div class="crm-msg-shell">
        <aside class="crm-msg-rail" aria-label="پوشه‌ها">
            <div class="crm-msg-rail-head">
                <span class="crm-msg-rail-title">پوشه‌ها</span>
            </div>
            <nav class="crm-msg-folders">
                <button type="button" class="crm-msg-folder active" data-folder="inbox">
                    <span class="crm-msg-folder-glyph"><i class="fas fa-inbox"></i></span>
                    <span class="crm-msg-folder-copy">
                        <strong>صندوق ورودی</strong>
                        <small>مکالمات فعال</small>
                    </span>
                    <em class="crm-msg-folder-badge" data-folder-unread="inbox" hidden>0</em>
                </button>
                <button type="button" class="crm-msg-folder" data-folder="starred">
                    <span class="crm-msg-folder-glyph crm-msg-folder-glyph--gold"><i class="fas fa-star"></i></span>
                    <span class="crm-msg-folder-copy">
                        <strong>ستاره‌دار</strong>
                        <small>نشان‌شده‌ها</small>
                    </span>
                </button>
                <button type="button" class="crm-msg-folder" data-folder="archived">
                    <span class="crm-msg-folder-glyph crm-msg-folder-glyph--muted"><i class="fas fa-box-archive"></i></span>
                    <span class="crm-msg-folder-copy">
                        <strong>آرشیو</strong>
                        <small>بایگانی‌شده</small>
                    </span>
                </button>
            </nav>
            <footer class="crm-msg-rail-foot">
                <i class="fas fa-clock-rotate-left" aria-hidden="true"></i>
                <span>نگهداری خودکار ۳۰ روزه</span>
            </footer>
        </aside>

        <div class="crm-msg-list-pane" data-msg-list-pane>
            <header class="crm-msg-list-toolbar">
                <div class="crm-msg-list-toolbar-meta">
                    <h3 data-msg-folder-title>صندوق ورودی</h3>
                    <span data-msg-thread-count>در حال بارگذاری...</span>
                </div>
                <label class="crm-msg-search">
                    <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search"
                           name="mk_team_msg_filter_q"
                           value=""
                           placeholder="جستجو..."
                           data-msg-search
                           dir="rtl"
                           aria-label="جستجو در مکالمات"
                           autocomplete="off"
                           autocorrect="off"
                           autocapitalize="off"
                           spellcheck="false"
                           data-lpignore="true"
                           data-1p-ignore="true"
                           data-form-type="other"
                           readonly>
                </label>
            </header>
            <ul class="crm-msg-thread-list" data-msg-thread-list role="listbox" aria-label="لیست مکالمات">
                <li class="crm-msg-state">
                    <span class="crm-msg-state-ring"><i class="fas fa-circle-notch fa-spin"></i></span>
                    <p>در حال بارگذاری...</p>
                </li>
            </ul>
        </div>

        <div class="crm-msg-convo" data-msg-detail hidden>
            <header class="crm-msg-convo-toolbar">
                <button type="button" class="crm-msg-icon-btn crm-msg-icon-btn--back" data-msg-back aria-label="بازگشت">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div class="crm-msg-convo-id">
                    <span class="crm-msg-avatar crm-msg-avatar--xl" data-msg-header-avatar>—</span>
                    <div class="crm-msg-convo-id-text">
                        <h3 data-msg-subject>—</h3>
                        <span data-msg-participants></span>
                    </div>
                </div>
                <div class="crm-msg-convo-tools">
                    <button type="button" class="crm-msg-icon-btn" data-msg-star title="ستاره‌دار" aria-pressed="false">
                        <i class="far fa-star"></i>
                    </button>
                    <button type="button" class="crm-msg-icon-btn" data-msg-archive title="آرشیو">
                        <i class="fas fa-box-archive"></i>
                    </button>
                    <div class="crm-msg-menu-wrap">
                        <button type="button" class="crm-msg-icon-btn" data-msg-thread-menu aria-haspopup="true" aria-expanded="false" title="گزینه‌های بیشتر">
                            <i class="fas fa-ellipsis-vertical"></i>
                        </button>
                        <div class="crm-msg-menu" data-msg-thread-menu-panel hidden>
                            <button type="button" data-msg-delete-thread>
                                <i class="fas fa-trash-can"></i>
                                <span>حذف از صندوق من</span>
                            </button>
                            <button type="button" data-msg-purge-thread hidden>
                                <i class="fas fa-fire"></i>
                                <span>حذف برای همه (مدیر)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <div class="crm-msg-stream" data-msg-messages role="log" aria-live="polite"></div>
            <form class="crm-msg-composer" data-msg-reply-form>
                <div class="crm-msg-composer-box">
                    <label class="crm-msg-composer-icon" title="ضمیمه">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp" hidden>
                    </label>
                    <textarea name="body" class="crm-msg-composer-field" rows="1" placeholder="پیام بنویسید..." required></textarea>
                    <button type="submit" class="crm-msg-composer-send" aria-label="ارسال">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="crm-msg-empty" data-msg-placeholder>
            <div class="crm-msg-empty-visual" aria-hidden="true">
                <span class="crm-msg-empty-orbit"></span>
                <span class="crm-msg-empty-orbit crm-msg-empty-orbit--2"></span>
                <span class="crm-msg-empty-core"><i class="fas fa-comments"></i></span>
            </div>
            <h3>گفتگویی انتخاب نشده</h3>
            <p>از لیست مکالمات یکی را باز کنید، یا گفتگوی تازه‌ای با تیم شروع کنید.</p>
            <button type="button" class="crm-msg-cta" data-msg-compose>
                <span class="crm-msg-cta-glow" aria-hidden="true"></span>
                <span class="crm-msg-cta-icon" aria-hidden="true"><i class="fas fa-comment-dots"></i></span>
                <span class="crm-msg-cta-copy">
                    <strong>شروع گفتگو</strong>
                    <small>پیام مستقیم یا همگانی به تیم</small>
                </span>
                <i class="fas fa-arrow-left crm-msg-cta-arrow" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</section>
{% endif %}
