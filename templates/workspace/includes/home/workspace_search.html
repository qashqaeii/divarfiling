<div class="wsh-search crm-global-search mk-global-search" id="crmGlobalSearch" data-help-tour="workspace-search">

        <i class="fas fa-search" aria-hidden="true"></i>
        <input type="search" class="crm-search-input wsh-search__input" id="crmSearchInput" data-url="{% url 'workspace:crm_search' %}" placeholder="جستجو در فایل‌ها، مخاطبین، آگهی‌ها..." autocomplete="off" aria-label="جستجوی سراسری">
        <kbd class="crm-search-kbd wsh-search__kbd" aria-hidden="true">Ctrl+K</kbd>
    </div>
    <div class="crm-search-results mk-search-results wsh-search__results" id="crmSearchResults" hidden></div>
