{% load workspace_tags %}
{% firstof filter_qs_noview filter_qs as filing_sort_qs %}
<div class="ws-filing-sort-sheet" id="wsMobSortSheet" hidden aria-hidden="true">
    <button type="button" class="ws-filing-sort-sheet__backdrop" data-ws-sort-close aria-label="بستن"></button>
    <div class="ws-filing-sort-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="wsMobSortTitle">
        <div class="ws-filing-sort-sheet__grab" aria-hidden="true"></div>
        <header class="ws-filing-sort-sheet__head">
            <h2 class="ws-filing-sort-sheet__title" id="wsMobSortTitle">مرتب‌سازی</h2>
            <button type="button" class="ws-filing-sort-sheet__close" data-ws-sort-close aria-label="بستن">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
        </header>
        <nav class="ws-filing-sort-sheet__list" aria-label="گزینه‌های مرتب‌سازی">
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=-published_at" class="ws-filing-sort-sheet__opt{% if filters.sort == '-published_at' or not filters.sort %} is-active{% endif %}">
                <span>جدیدترین</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=published_at" class="ws-filing-sort-sheet__opt{% if filters.sort == 'published_at' %} is-active{% endif %}">
                <span>قدیمی‌ترین</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
            {% if tx.show_price %}
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=-price" class="ws-filing-sort-sheet__opt{% if filters.sort == '-price' %} is-active{% endif %}">
                <span>بیشترین قیمت</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=price" class="ws-filing-sort-sheet__opt{% if filters.sort == 'price' %} is-active{% endif %}">
                <span>کمترین قیمت</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
            {% endif %}
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=-area" class="ws-filing-sort-sheet__opt{% if filters.sort == '-area' %} is-active{% endif %}">
                <span>بیشترین متراژ</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
            <a href="?{% if filing_sort_qs %}{{ filing_sort_qs }}&{% endif %}sort=neighborhood" class="ws-filing-sort-sheet__opt{% if filters.sort == 'neighborhood' %} is-active{% endif %}">
                <span>محله (الف–ی)</span>
                <i class="fas fa-check" aria-hidden="true"></i>
            </a>
        </nav>
    </div>
</div>
