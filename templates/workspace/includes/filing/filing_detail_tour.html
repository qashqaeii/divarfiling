<script src="{% static 'workspace/js/onboarding-tour.js' %}?v=6"></script>
<script>
(function () {
    var cfg = window.wsFilingDetailTourConfig;
    if (!cfg) return;

    function startFilingDetailTour() {
        document.querySelectorAll('.ws-modal.is-open').forEach(function (m) {
            m.classList.remove('is-open');
        });
        document.body.classList.remove('ws-modal-open');
        if (window.wsWorkspaceTour) window.wsWorkspaceTour.start(cfg);
    }

    window.wsStartFilingDetailTour = startFilingDetailTour;

    document.querySelectorAll('[data-fl-tour-start]').forEach(function (btn) {
        btn.addEventListener('click', startFilingDetailTour);
    });

    var params = new URLSearchParams(window.location.search);
    if (params.get('filing_tour') === '1' || params.get('tour') === 'filing') {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () { setTimeout(startFilingDetailTour, 400); });
        } else {
            setTimeout(startFilingDetailTour, 400);
        }
    }
})();
</script>
