<dialog class="crm-modal crm-prop-duplicate-modal" data-crm-prop-duplicate-modal aria-labelledby="crmPropDuplicateTitle">
    <div class="crm-modal__panel">
        <header class="crm-modal__head">
            <h2 id="crmPropDuplicateTitle" class="crm-modal__title">کپی این فایل ساخته شود؟</h2>
        </header>
        <div class="crm-modal__body">
            <p class="crm-modal__text">
                یک فایل جدید با اطلاعات مشابه ایجاد می‌شود و می‌توانید بعد از ساخت، مشخصات آن را ویرایش کنید.
            </p>
        </div>
        <footer class="crm-modal__foot">
            <button type="button" class="crm-btn crm-btn-ghost" data-crm-prop-duplicate-cancel>انصراف</button>
            <button type="button" class="crm-btn crm-btn-primary" data-crm-prop-duplicate-confirm>
                <i class="fas fa-copy" aria-hidden="true"></i>
                <span data-crm-prop-duplicate-confirm-label>ساخت کپی</span>
            </button>
        </footer>
    </div>
</dialog>
