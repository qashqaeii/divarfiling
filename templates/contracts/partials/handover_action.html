{% load contract_tags %}
{% if contract.status == 'finalized' %}
<div class="ct-handover-actions{% if handover_actions_class %} {{ handover_actions_class }}{% endif %}">
    {% if finalized_handover and handover_public_pdf_url %}
    <a href="{{ handover_public_pdf_url }}" target="_blank" rel="noopener" class="crm-dash-act ct-handover-act ct-handover-act--done{% if handover_primary %} crm-dash-act--primary{% endif %}">
        <i class="fas fa-file-contract" aria-hidden="true"></i>
        <span>مشاهده صورت‌جلسه تحویل</span>
    </a>
    {% elif handover and handover.status != 'finalized' %}
    <a href="{% ct_handover_wizard_url contract handover %}" class="crm-dash-act crm-dash-act--primary ct-handover-act">
        <i class="fas fa-clipboard-list" aria-hidden="true"></i>
        <span>ادامه صورت‌جلسه تحویل</span>
    </a>
    {% else %}
    <form method="post" action="{% ct_handover_create_url contract %}" class="ct-handover-form">{% csrf_token %}
        <button type="submit" class="crm-dash-act crm-dash-act--primary ct-handover-act">
            <i class="fas fa-clipboard-list" aria-hidden="true"></i>
            <span>ثبت صورت‌جلسه تحویل ملک</span>
        </button>
    </form>
    {% endif %}
</div>
{% endif %}
