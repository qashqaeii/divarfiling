<section class="wsh-actions" aria-label="اقدام‌های سریع" data-help-tour="workspace-actions" data-tour="workspace-quick-actions">
    {% if has_bot_license %}
    <a href="{% url 'workspace:multi_listings' %}" class="wsh-action wsh-action--primary">
        <span class="wsh-action__icon" aria-hidden="true"><i class="fas fa-magnifying-glass"></i></span>
        <span class="wsh-action__body">
            <strong>پیدا کردن فایل</strong>
            <em>جستجوی پیشرفته در فایلینگ</em>
        </span>
        <i class="wsh-action__chev fas fa-arrow-left" aria-hidden="true"></i>
    </a>
    {% else %}
    <a href="{% url 'workspace:crm_properties' %}" class="wsh-action wsh-action--primary">
        <span class="wsh-action__icon" aria-hidden="true"><i class="fas fa-folder-open"></i></span>
        <span class="wsh-action__body">
            <strong>فایل‌های شخصی</strong>
            <em>ثبت و مدیریت ملک‌های خودتان</em>
        </span>
        <i class="wsh-action__chev fas fa-arrow-left" aria-hidden="true"></i>
    </a>
    {% endif %}
    <div class="wsh-actions__row">
        <a href="{% url 'workspace:crm_contacts' %}?open=drawer-contact" class="wsh-action wsh-action--compact">
            <span class="wsh-action__icon" aria-hidden="true"><i class="fas fa-user-plus"></i></span>
            <span class="wsh-action__body">
                <strong>مخاطب</strong>
            </span>
        </a>
        <a href="{% url 'workspace:crm_properties' %}?open=drawer-property" class="wsh-action wsh-action--compact">
            <span class="wsh-action__icon" aria-hidden="true"><i class="fas fa-building"></i></span>
            <span class="wsh-action__body">
                <strong>فایل شخصی</strong>
            </span>
        </a>
        <a href="{% url 'workspace:crm_reminders' %}?drawer=reminder" class="wsh-action wsh-action--compact">
            <span class="wsh-action__icon" aria-hidden="true"><i class="fas fa-bell"></i></span>
            <span class="wsh-action__body">
                <strong>یادآور</strong>
            </span>
        </a>
    </div>
</section>
