<div class="fl-toolbar__filters fl-toolbar__filters--desk">
    <label class="fl-toolbar__field">
        <span class="fl-toolbar__field-icon" aria-hidden="true"><i class="fas fa-exchange-alt"></i></span>
        <select name="tx" class="fl-toolbar__select mk-filter-select" aria-label="نوع معامله">
            <option value="">همه معاملات</option>
            <option value="sale" {% if filters.tx == 'sale' %}selected{% endif %}>فروش</option>
            <option value="rent" {% if filters.tx == 'rent' %}selected{% endif %}>اجاره</option>
            <option value="mixed" {% if filters.tx == 'mixed' %}selected{% endif %}>ترکیبی</option>
        </select>
    </label>
    <label class="fl-toolbar__field">
        <span class="fl-toolbar__field-icon" aria-hidden="true"><i class="fas fa-map-marker-alt"></i></span>
        <select name="city" class="fl-toolbar__select mk-filter-select" aria-label="شهر">
            <option value="">همه شهرها</option>
            {% for c in cities %}
            <option value="{{ c }}" {% if filters.city == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="fl-toolbar__field">
        <span class="fl-toolbar__field-icon" aria-hidden="true"><i class="fas fa-file"></i></span>
        <select name="format" class="fl-toolbar__select mk-filter-select" aria-label="فرمت">
            <option value="">همه فرمت‌ها</option>
            <option value="xlsx" {% if filters.format == 'xlsx' %}selected{% endif %}>Excel</option>
            <option value="csv" {% if filters.format == 'csv' %}selected{% endif %}>CSV</option>
            <option value="json" {% if filters.format == 'json' %}selected{% endif %}>JSON</option>
        </select>
    </label>
</div>
