<nav class="acd-stepper" aria-label="قدم‌های ماموریت" style="--acd-steps: {{ steps|length }};">
    <div class="acd-stepper-track">
        {% for item in steps %}
        <button type="button"
                class="acd-stepper-item{% if item.is_done %} is-done{% elif item.is_current %} is-current{% endif %}"
                data-acd-step="{{ item.step.order }}"
                aria-current="{% if item.is_current %}step{% else %}false{% endif %}">
            <span class="acd-stepper-num">
                {% if item.is_done %}<i class="fas fa-check" aria-hidden="true"></i>{% else %}{{ item.step.order }}{% endif %}
            </span>
            <span class="acd-stepper-label">{{ item.video.title|truncatechars:28 }}</span>
        </button>
        {% endfor %}
    </div>
</nav>
