{% if feat.image_authenticity == 'real' %}
<span class="mk-img-auth mk-img-auth--real{% if auth_class %} {{ auth_class }}{% endif %}" title="تصویرها برای همین ملک است">
    <i class="fa-solid fa-images" aria-hidden="true"></i>
    <span>واقعی</span>
</span>
{% elif feat.image_authenticity == 'fake' %}
<span class="mk-img-auth mk-img-auth--fake{% if auth_class %} {{ auth_class }}{% endif %}" title="تصویرها برای همین ملک نیست — احتمالاً نمونه یا فیک">
    <i class="fa-solid fa-images" aria-hidden="true"></i>
    <span>فیک</span>
</span>
{% endif %}
