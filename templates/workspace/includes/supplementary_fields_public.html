{% load workspace_tags %}
{% if groups %}
<div class="ws-extra-groups">
    {% for group in groups %}
    <section class="ws-extra-group">
        <h4 class="ws-extra-group-title">{{ group.name }}</h4>
        <dl class="ws-extra-grid">
            {% for field in group.fields %}
            <div class="ws-extra-item">
                <dt>
                    <i class="fas {{ field.key|feature_icon }}" aria-hidden="true"></i>
                    {{ field.key }}
                </dt>
                <dd>{% include 'workspace/includes/field_value_public.html' with field=field %}</dd>
            </div>
            {% endfor %}
        </dl>
    </section>
    {% endfor %}
</div>
{% else %}
<p class="ws-field-empty">اطلاعات تکمیلی دیگری ثبت نشده.</p>
{% endif %}
