{% load workspace_tags crm_tags %}
<section class="crm-contact-intel-strip" aria-label="خلاصه عملیاتی">
    <button type="button" class="crm-contact-intel-strip__cell crm-contact-intel-strip__cell--next{% if follow_up_state == 'overdue' %} is-warn{% elif follow_up_state == 'today' %} is-accent{% endif %}{% if not customer_is_shared %} is-action{% endif %}" {% if not customer_is_shared %}data-drawer-open="drawer-followup"{% endif %}>
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-bell"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>اقدام بعدی</em>
            {% if customer.next_follow_up %}
            <strong>{% if follow_up_state == 'overdue' %}تماس — معوق{% elif follow_up_state == 'today' %}تماس — امروز{% else %}{{ customer.next_follow_up|ws_jalali }}{% endif %}</strong>
            {% else %}
            <strong class="is-muted">ثبت نشده</strong>
            {% endif %}
        </span>
    </button>

    <button type="button" class="crm-contact-intel-strip__cell{% if not customer_is_shared %} is-action{% endif %}" data-tab-jump="timeline">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-phone-volume"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>آخرین تماس</em>
            {% if activities %}
            <strong>{{ activities.0.activity_type }} · {{ activities.0.created_at|ws_jalali_datetime }}</strong>
            {% else %}
            <strong class="is-muted">—</strong>
            {% endif %}
        </span>
    </button>

    {% if match_data.eligible %}
    <button type="button" class="crm-contact-intel-strip__cell is-action" data-tab-jump="matches">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-house"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>فایل پیشنهادی</em>
            {% if match_data.total_count %}
            <strong>{{ match_data.total_count }} فایل</strong>
            {% else %}
            <strong class="is-muted">۰</strong>
            {% endif %}
        </span>
    </button>
    {% endif %}

    {% if deals %}
    <a href="{% url 'workspace:crm_deal_detail' deals.0.id %}" class="crm-contact-intel-strip__cell is-action">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-handshake"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>معامله</em>
            <strong>{{ deals|length }} فعال</strong>
        </span>
    </a>
    {% elif not customer_is_shared %}
    <button type="button" class="crm-contact-intel-strip__cell is-action" data-drawer-open="drawer-deal">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-handshake"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>معامله</em>
            <strong class="is-muted">۰</strong>
        </span>
    </button>
    {% else %}
    <span class="crm-contact-intel-strip__cell">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-handshake"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>معامله</em>
            <strong class="is-muted">۰</strong>
        </span>
    </span>
    {% endif %}

    {% if reminders %}
    <button type="button" class="crm-contact-intel-strip__cell is-action" data-drawer-open="drawer-reminder">
        <span class="crm-contact-intel-strip__ico" aria-hidden="true"><i class="fas fa-clock"></i></span>
        <span class="crm-contact-intel-strip__copy">
            <em>یادآور</em>
            <strong>{{ reminders.0.title|truncatechars:20 }}</strong>
        </span>
    </button>
    {% endif %}
</section>
