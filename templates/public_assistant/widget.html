{% load static %}
{% if public_assistant_widget %}
<link rel="stylesheet" href="{% static 'public_assistant/css/widget.css' %}?v=3">
<div id="pa-root" class="pa-root" dir="rtl" data-config-url="{% url 'public_assistant:config' %}" data-chat-url="{% url 'public_assistant:chat' %}" data-feedback-url="{% url 'public_assistant:feedback' %}" data-reset-url="{% url 'public_assistant:reset' %}" hidden>
  <button type="button" class="pa-backdrop" id="paBackdrop" aria-label="بستن گفتگو" tabindex="-1"></button>
  <button type="button" class="pa-fab" id="paFab" aria-label="گفتگو با دستیار فایلینگ دیوار" aria-expanded="false" aria-controls="paPanel">
    <span class="pa-fab__icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3C7.03 3 3 6.58 3 11c0 2.02.9 3.85 2.36 5.22L4 21l4.96-1.28C9.9 20.45 10.93 20.6 12 20.6c4.97 0 9-3.58 9-8s-4.03-8-9-8z" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="8.5" cy="11" r="1" fill="currentColor"/>
        <circle cx="12" cy="11" r="1" fill="currentColor"/>
        <circle cx="15.5" cy="11" r="1" fill="currentColor"/>
      </svg>
    </span>
  </button>
  <div class="pa-panel" id="paPanel" role="dialog" aria-label="دستیار فایلینگ دیوار" aria-modal="true" hidden>
    <header class="pa-panel__head">
      <div class="pa-panel__title">
        <span class="pa-panel__badge">AI</span>
        <span class="pa-panel__title-text">دستیار فایلینگ دیوار</span>
      </div>
      <div class="pa-panel__actions">
        <button type="button" class="pa-btn pa-btn--ghost" id="paNewChat" title="گفتگوی جدید">گفتگوی جدید</button>
        <button type="button" class="pa-btn pa-btn--icon" id="paClose" aria-label="بستن">×</button>
      </div>
    </header>
    <div class="pa-messages" id="paMessages" tabindex="0" aria-live="polite"></div>
    <div class="pa-suggestions-wrap" id="paSuggestionsWrap">
      <p class="pa-suggestions-label">پیشنهاد سؤال</p>
      <div class="pa-suggestions" id="paSuggestions"></div>
    </div>
    <form class="pa-compose" id="paForm">
      <label class="pa-compose__label" for="paInput">پیام شما</label>
      <div class="pa-compose__row">
        <textarea id="paInput" class="pa-compose__input" rows="1" maxlength="1200" placeholder="سؤال خود را بنویسید…" autocomplete="off"></textarea>
        <button type="submit" class="pa-btn pa-btn--primary" id="paSend" aria-label="ارسال پیام">ارسال</button>
      </div>
    </form>
    <p class="pa-footnote">پاسخ‌ها بر اساس دانشنامه عمومی است؛ به اطلاعات حساب شما دسترسی ندارد.</p>
  </div>
</div>
<script src="{% static 'public_assistant/js/widget.js' %}?v=3" defer></script>
{% endif %}
