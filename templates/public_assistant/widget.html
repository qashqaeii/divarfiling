{% load static %}
{% if public_assistant_widget %}
<link rel="stylesheet" href="{% static 'public_assistant/css/widget.css' %}?v=30">
<div id="pa-root" class="pa-root" dir="rtl" data-config-url="{% url 'public_assistant:config' %}" data-chat-url="{% url 'public_assistant:chat' %}" data-feedback-url="{% url 'public_assistant:feedback' %}" data-reset-url="{% url 'public_assistant:reset' %}" hidden>
  <button type="button" class="pa-backdrop" id="paBackdrop" aria-label="بستن گفتگو" tabindex="-1"></button>
  <div class="pa-dock" id="paDock">
    <div class="pa-panel" id="paPanel" role="dialog" aria-label="دستیار فایلینگ دیوار" aria-modal="true" hidden inert>
      <div class="pa-panel__glow" aria-hidden="true"></div>
      <header class="pa-head" id="paHead">
        <div class="pa-head__brand">
          <div class="pa-head__text">
            <span class="pa-head__kicker">دستیار هوشمند</span>
            <span class="pa-head__title">فایلینگ دیوار</span>
          </div>
        </div>
        <div class="pa-head__tools" role="toolbar" aria-label="ابزارهای گفتگو">
          <button type="button" class="pa-icon-btn pa-icon-btn--new" id="paNewChat" title="گفتگوی جدید" aria-label="گفتگوی جدید">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/></svg>
          </button>
          <span class="pa-head__tools-sep" aria-hidden="true"></span>
          <button type="button" class="pa-icon-btn pa-icon-btn--min" id="paMinimize" title="جمع‌کردن" aria-label="جمع‌کردن پنجره">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/></svg>
          </button>
          <span class="pa-head__tools-sep" aria-hidden="true"></span>
          <button type="button" class="pa-icon-btn pa-icon-btn--close" id="paClose" title="بستن" aria-label="بستن">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="pa-thread">
        <div class="pa-messages" id="paMessages" tabindex="0">
          <div class="pa-welcome" id="paWelcome">
            <div class="pa-welcome__hero" aria-hidden="true">
              <span class="pa-welcome__aura"></span>
              <img
                class="pa-welcome__robot"
                id="paWelcomeRobot"
                src="{% static 'images/RobotAnimation.gif' %}"
                width="112"
                height="112"
                alt=""
                decoding="async"
                draggable="false"
              >
            </div>
            <p class="pa-welcome__eyebrow">دستیار هوشمند فایلینگ</p>
            <h2 class="pa-welcome__title">سلام، خوش آمدید</h2>
            <div class="pa-welcome__suggest-head">پیشنهاد برای شروع</div>
            <div class="pa-welcome__suggestions" id="paSuggestions" role="list"></div>
          </div>
        </div>
        <button type="button" class="pa-jump" id="paJumpEnd" hidden aria-label="رفتن به آخر گفتگو">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <footer class="pa-footer">
        <form class="pa-compose" id="paForm">
          <label class="pa-compose__label" for="paInput">پیام شما</label>
          <div class="pa-compose__shell">
            <textarea id="paInput" class="pa-compose__input" rows="1" maxlength="1200" placeholder="پیامتان را بنویسید…" autocomplete="off" enterkeyhint="send"></textarea>
            <button type="submit" class="pa-send" id="paSend" aria-label="ارسال پیام" disabled>
              <span class="pa-send__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 19V7" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/>
                  <path d="M7.5 11.5 12 7l4.5 4.5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="pa-send__spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </footer>
    </div>
    <button type="button" class="pa-fab" id="paFab" aria-label="گفتگو با دستیار فایلینگ دیوار" aria-expanded="false" aria-controls="paPanel">
      <img
        class="pa-fab__robot"
        src="{% static 'images/RobotAnimation.gif' %}"
        width="72"
        height="72"
        alt=""
        decoding="async"
        fetchpriority="low"
        draggable="false"
      >
    </button>
  </div>
</div>
<script src="{% static 'public_assistant/js/widget.js' %}?v=30" defer></script>
{% endif %}
