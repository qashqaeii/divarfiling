{% if traditional_path %}
<section class="acd-traditional-card acd-card">
    <div class="acd-traditional-body">
        <span class="acd-traditional-kicker"><i class="fas fa-compass" aria-hidden="true"></i> تازه‌وارد هستید؟</span>
        <h2 class="acd-traditional-title">{{ traditional_path.title }}</h2>
        <p class="acd-traditional-desc">{{ traditional_path.description }}</p>
        <p class="acd-traditional-meta"><i class="fas fa-film" aria-hidden="true"></i> ۵ ویدیو · ~۲۰ دقیقه</p>
    </div>
    <a href="{% url 'workspace:academy_traditional' %}" class="acd-btn acd-btn--ghost">
        شروع از اینجا <i class="fas fa-arrow-left" aria-hidden="true"></i>
    </a>
</section>
{% endif %}
