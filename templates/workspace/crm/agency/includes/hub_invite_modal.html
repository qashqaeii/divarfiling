<div class="modal fade agency-modal" id="agencyInviteModal" tabindex="-1" aria-labelledby="agencyInviteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form method="post" action="{{ crm_team_url }}" class="modal-content">
            {% csrf_token %}
            <input type="hidden" name="action" value="agency_invite">
            <input type="hidden" name="tab" value="members">
            <div class="modal-header agency-modal__header">
                <div>
                    <h5 class="modal-title" id="agencyInviteModalLabel">دعوت مشاور جدید</h5>
                    <p class="agency-modal__subtitle">دعوت از طریق SMS ارسال می‌شود</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
            </div>
            <div class="modal-body">
                <div class="agency-modal__info">
                    <span aria-hidden="true">{% include 'includes/icon_slot.html' with decor='send' size='inline' only %}</span>
                    <span>پس از پذیرش دعوت، می‌توانید صندلی لایسنس را به مشاور تخصیص دهید.</span>
                </div>
                <div class="agency-field">
                    <label class="agency-form-label" for="agencyInvitePhone">شماره موبایل</label>
                    <input type="tel" id="agencyInvitePhone" name="phone" class="crm-input agency-modal__input" required dir="ltr" placeholder="09123456789" autocomplete="tel" inputmode="tel">
                    <p class="agency-form-helper" id="agencyModalPhoneHint" hidden></p>
                </div>
                {% if agency_roles_invite %}
                <div class="agency-field">
                    <label class="agency-form-label" for="agencyInviteRole">نقش</label>
                    <select id="agencyInviteRole" name="role" class="crm-input agency-modal__input" required>
                        {% for code, label in agency_roles_invite %}
                        <option value="{{ code }}"{% if code == 'advisor' %} selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% else %}
                <input type="hidden" name="role" value="advisor">
                {% endif %}
            </div>
            <div class="modal-footer agency-modal__footer">
                <button type="button" class="crm-btn crm-btn-ghost" data-bs-dismiss="modal">انصراف</button>
                <button type="submit" class="crm-btn crm-btn-primary">
                    <span aria-hidden="true">{% include 'includes/icon_slot.html' with decor='send' size='inline' only %}</span>
                    ارسال دعوت SMS
                </button>
            </div>
        </form>
    </div>
</div>
