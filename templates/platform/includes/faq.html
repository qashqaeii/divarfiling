{% if platform_content.faq %}
<section class="plat-section plat-faq" aria-labelledby="plat-faq-title">
    <div class="container plat-section__inner plat-faq__inner">
        {% include 'platform/includes/section_head.html' with eyebrow='پاسخ سریع' title='سوالات متداول' id='plat-faq-title' centered=True %}
        <div class="plat-faq__list" role="list">
            {% for item in platform_content.faq %}
            <details class="plat-faq__item plat-reveal">
                <summary>{{ item.q }}</summary>
                <div class="plat-faq__answer">
                    <p>{{ item.a }}</p>
                </div>
            </details>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
