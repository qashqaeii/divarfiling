{% load humanize %}
<section class="fl-kpi-grid" aria-label="آمار فایلینگ">
    <article class="fl-kpi-card fl-kpi-card--purple">
        <span class="fl-kpi-card__icon" aria-hidden="true"><i class="fas fa-folder-open"></i></span>
        <div class="fl-kpi-card__body">
            <strong class="fl-kpi-card__value">{{ stats.files }}</strong>
            <span class="fl-kpi-card__label">پوشه استخراج</span>
            <span class="fl-kpi-card__sub">مجموع پوشه‌های ایجادشده</span>
        </div>
    </article>
    <article class="fl-kpi-card fl-kpi-card--blue">
        <span class="fl-kpi-card__icon" aria-hidden="true"><i class="fas fa-file-lines"></i></span>
        <div class="fl-kpi-card__body">
            <strong class="fl-kpi-card__value">{{ stats.listings|intcomma }}</strong>
            <span class="fl-kpi-card__label">آگهی دیوار</span>
            <span class="fl-kpi-card__sub">در تمام پوشه‌ها</span>
        </div>
    </article>
    <article class="fl-kpi-card fl-kpi-card--green">
        <span class="fl-kpi-card__icon" aria-hidden="true"><i class="fas fa-tag"></i></span>
        <div class="fl-kpi-card__body">
            <strong class="fl-kpi-card__value">{{ stats.sale }}</strong>
            <span class="fl-kpi-card__label">فروش</span>
            <span class="fl-kpi-card__sub">پوشه استخراج</span>
        </div>
    </article>
    <article class="fl-kpi-card fl-kpi-card--cyan">
        <span class="fl-kpi-card__icon" aria-hidden="true"><i class="fas fa-house"></i></span>
        <div class="fl-kpi-card__body">
            <strong class="fl-kpi-card__value">{{ stats.rent }}</strong>
            <span class="fl-kpi-card__label">اجاره</span>
            <span class="fl-kpi-card__sub">پوشه استخراج</span>
        </div>
    </article>
</section>
