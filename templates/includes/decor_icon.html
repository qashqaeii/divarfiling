{% if not missing %}
<span class="df-decor-icon df-decor-icon--{{ size }}{% if boxed %} df-decor-icon--boxed{% if accent %} df-decor-icon--{{ accent }}{% endif %}{% endif %}{% if class_name %} {{ class_name }}{% endif %}"{% if alt %} title="{{ alt }}"{% endif %}>
    <img src="{{ src }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}" loading="lazy" decoding="async" draggable="false">
</span>
{% endif %}
