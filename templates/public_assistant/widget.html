{% load static %}
{% if public_assistant_widget %}
<link rel="stylesheet" href="{% static 'public_assistant/css/widget.css' %}?v=6">
<div id="pa-root" class="pa-root" dir="rtl" data-config-url="{% url 'public_assistant:config' %}" data-chat-url="{% url 'public_assistant:chat' %}" data-feedback-url="{% url 'public_assistant:feedback' %}" data-reset-url="{% url 'public_assistant:reset' %}" hidden>
  <button type="button" class="pa-backdrop" id="paBackdrop" aria-label="بستن گفتگو" tabindex="-1"></button>
  <button type="button" class="pa-fab" id="paFab" aria-label="گفتگو با دستیار فایلینگ دیوار" aria-expanded="false" aria-controls="paPanel">
    <span class="pa-fab__pulse" aria-hidden="true"></span>
    <span class="pa-fab__icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3l1.2 3.6L17 8l-3.6 1.2L12 13l-1.2-3.8L7 8l3.8-1.4L12 3z" fill="currentColor" opacity=".9"/>
        <path d="M9.5 4.5h5A5.5 5.5 0 0 1 20 10v5.8c0 .7-.6 1.2-1.3 1.2H8.2l-3.7 2.5V10A5.5 5.5 0 0 1 9.5 4.5Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  <div class="pa-panel" id="paPanel" role="dialog" aria-label="دستیار فایلینگ دیوار" aria-modal="true" hidden>
    <header class="pa-head">
      <div class="pa-head__brand">
        <span class="pa-head__avatar" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l1.4 4.2L17.6 9l-4.2 1.4L12 14.6 10.6 10.4 6.4 9l4.2-1.4L12 3z" fill="currentColor"/>
            <circle cx="18" cy="6" r="1.2" fill="currentColor" opacity=".85"/>
          </svg>
        </span>
        <div class="pa-head__text">
          <div class="pa-head__title-row">
            <span class="pa-head__title">دستیار فایلینگ دیوار</span>
            <span class="pa-head__badge">AI</span>
          </div>
          <span class="pa-head__sub">
            <span class="pa-head__status" aria-hidden="true"><span class="pa-head__dot"></span>آماده پاسخ‌گویی</span>
            <span class="pa-head__sub-sep" aria-hidden="true">·</span>
            <span>راهنمای محصول و شروع کار</span>
          </span>
        </div>
      </div>
      <div class="pa-head__tools">
        <button type="button" class="pa-icon-btn" id="paNewChat" title="گفتگوی جدید" aria-label="گفتگوی جدید">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="pa-icon-btn" id="paClose" aria-label="بستن">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="pa-messages" id="paMessages" tabindex="0" aria-live="polite" aria-relevant="additions"></div>
    <div class="pa-suggestions-wrap" id="paSuggestionsWrap">
      <p class="pa-suggestions-label" id="paSuggestionsLabel">پیشنهاد برای شروع</p>
      <div class="pa-suggestions" id="paSuggestions" role="list"></div>
    </div>
    <footer class="pa-footer">
      <form class="pa-compose" id="paForm">
        <label class="pa-compose__label" for="paInput">پیام شما</label>
        <div class="pa-compose__shell">
          <textarea id="paInput" class="pa-compose__input" rows="1" maxlength="1200" placeholder="سؤال خود را بنویسید — مثلاً تفاوت CRM و فایلینگ…" autocomplete="off" enterkeyhint="send"></textarea>
          <button type="submit" class="pa-send" id="paSend" aria-label="ارسال پیام">
            <span class="pa-send__icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="pa-send__spinner" aria-hidden="true"></span>
          </button>
        </div>
      </form>
      <p class="pa-footnote">پاسخ از دانشنامه عمومی — بدون دسترسی به حساب شما</p>
    </footer>
  </div>
</div>
<script src="{% static 'public_assistant/js/widget.js' %}?v=6" defer></script>
{% endif %}
