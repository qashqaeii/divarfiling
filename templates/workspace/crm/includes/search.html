<div class="crm-global-search mk-global-search" id="crmGlobalSearch">

        <i class="fas fa-search" aria-hidden="true"></i>
        <input type="search" class="crm-search-input" id="crmSearchInput" data-search-url="{% url 'workspace:crm_search' %}" placeholder="جستجوی سراسری — نام، تلفن، ملک..." autocomplete="off">
        <kbd class="crm-search-kbd">Ctrl+K</kbd>

</div>
