<nav class="a360-tabs" aria-label="بخش‌های مشاور">
    {% for key, label in tabs %}
    <a href="?tab={{ key }}{% if key == 'overview' %}&period={{ period }}{% endif %}"
       class="a360-tab{% if tab == key %} is-active{% endif %}"
       {% if tab == key %}aria-current="page"{% endif %}>
        <span class="a360-tab__icon" aria-hidden="true">
            {% if key == 'overview' %}<i class="fas fa-gauge-high"></i>
            {% elif key == 'contacts' %}<i class="fas fa-address-book"></i>
            {% elif key == 'properties' %}<i class="fas fa-building"></i>
            {% elif key == 'deals' %}<i class="fas fa-handshake"></i>
            {% elif key == 'filing' %}<i class="fas fa-database"></i>
            {% elif key == 'contracts' %}<i class="fas fa-file-signature"></i>
            {% elif key == 'activities' %}<i class="fas fa-clock-rotate-left"></i>
            {% else %}<i class="fas fa-circle"></i>
            {% endif %}
        </span>
        <span class="a360-tab__label">{{ label }}</span>
    </a>
    {% endfor %}
</nav>
