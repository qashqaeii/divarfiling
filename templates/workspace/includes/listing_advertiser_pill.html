{% if feat.advertiser %}
<span class="mk-pub-pill {{ feat.advertiser.pill_class }}" title="{{ feat.advertiser.title }}">
    <i class="fas {{ feat.advertiser.icon }}" aria-hidden="true"></i><span>{{ feat.advertiser.label }}</span>
</span>
{% elif feat.is_consultant %}
<span class="mk-pub-pill mk-pub-pill--consultant" title="مشاور املاک"><i class="fas fa-building" aria-hidden="true"></i><span>مشاور</span></span>
{% else %}
<span class="mk-pub-pill mk-pub-pill--personal" title="آگهی شخصی"><i class="fas fa-user" aria-hidden="true"></i><span>شخصی</span></span>
{% endif %}
