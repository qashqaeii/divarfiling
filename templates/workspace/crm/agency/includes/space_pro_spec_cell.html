<li class="agency-space-pro-spec-cell{% if accent %} agency-space-pro-spec-cell--accent{% endif %}">
    <span class="agency-space-pro-spec-cell__icon" aria-hidden="true"><i class="fas {{ icon }}" aria-hidden="true"></i></span>
    <div class="agency-space-pro-spec-cell__body">
        <span class="agency-space-pro-spec-cell__label">{{ label }}</span>
        <span class="agency-space-pro-spec-cell__value">{{ value }}</span>
    </div>
</li>
