<script src="{% static 'workspace/js/onboarding-tour.js' %}?v=12"></script>
<script>
(function () {
    var cfg = window.wsFilingListTourConfig;
    if (!cfg) return;

    function startFilingListTour() {
        document.querySelectorAll('.ws-modal.is-open').forEach(function (m) {
            m.classList.remove('is-open');
        });
        document.body.classList.remove('ws-modal-open');
        if (window.wsWorkspaceTour) window.wsWorkspaceTour.start(cfg);
    }

    window.wsStartFilingListTour = startFilingListTour;

    document.querySelectorAll('[data-fl-tour-start]').forEach(function (btn) {
        btn.addEventListener('click', startFilingListTour);
    });

    var params = new URLSearchParams(window.location.search);
    if (params.get('filing_tour') === '1' || params.get('tour') === 'filing') {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () { setTimeout(startFilingListTour, 400); });
        } else {
            setTimeout(startFilingListTour, 400);
        }
    }
})();
</script>
