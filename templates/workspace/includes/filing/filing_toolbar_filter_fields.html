<div class="ws-filters__fields fl-toolbar__filters fl-toolbar__filters--desk{% if filters.tx or filters.city or filters.format %} is-filtered{% endif %}">
    <label class="fl-toolbar__field">
        <select name="tx" class="ws-filters__select fl-toolbar__select mk-filter-select{% if filters.tx %} is-active{% endif %}" aria-label="نوع معامله">
            <option value="">معامله</option>
            <option value="sale" {% if filters.tx == 'sale' %}selected{% endif %}>فروش</option>
            <option value="rent" {% if filters.tx == 'rent' %}selected{% endif %}>اجاره</option>
            <option value="mixed" {% if filters.tx == 'mixed' %}selected{% endif %}>ترکیبی</option>
        </select>
    </label>
    <label class="fl-toolbar__field">
        <select name="city" class="ws-filters__select fl-toolbar__select mk-filter-select{% if filters.city %} is-active{% endif %}" aria-label="شهر">
            <option value="">شهر</option>
            {% for c in cities %}
            <option value="{{ c }}" {% if filters.city == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="fl-toolbar__field">
        <select name="format" class="ws-filters__select fl-toolbar__select mk-filter-select{% if filters.format %} is-active{% endif %}" aria-label="فرمت">
            <option value="">فرمت</option>
            <option value="xlsx" {% if filters.format == 'xlsx' %}selected{% endif %}>Excel</option>
            <option value="csv" {% if filters.format == 'csv' %}selected{% endif %}>CSV</option>
            <option value="json" {% if filters.format == 'json' %}selected{% endif %}>JSON</option>
        </select>
    </label>
</div>
