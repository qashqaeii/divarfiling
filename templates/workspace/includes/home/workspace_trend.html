<section class="wsh2-panel wsh2-trend" data-trend-chart data-tour="workspace-trend" aria-label="روند فعالیت">
    <header class="wsh2-panel__head">
        <div class="wsh2-panel__title">
            <span class="wsh2-panel__icon" aria-hidden="true"><i class="fas fa-chart-line"></i></span>
            <div>
                <h2 id="hubTrendTitle">روند فعالیت</h2>
                <p class="wsh2-panel__sub">مخاطب، فایل و معامله</p>
            </div>
        </div>
        <div class="wsh2-trend__range" role="group" aria-label="بازه زمانی">
            <button type="button" class="wsh2-trend__btn mk-insight-range-btn is-active" data-trend-range="7">۷ روز</button>
            <button type="button" class="wsh2-trend__btn mk-insight-range-btn" data-trend-range="30">۳۰ روز</button>
        </div>
    </header>

    {% if trend_has_data %}
    <div class="wsh2-trend__legend" id="hubTrendLegend" aria-hidden="true"></div>
    <div class="wsh2-trend__chart">
        <canvas id="chart-activity" height="200" aria-label="نمودار روند فعالیت"></canvas>
    </div>
    {% else %}
    <div class="wsh2-empty wsh2-empty--chart">
        <i class="fas fa-chart-area" aria-hidden="true"></i>
        <p>هنوز داده کافی برای نمودار نیست.</p>
        <span>با ثبت مخاطب، فایل یا معامله، روند اینجا دیده می‌شود.</span>
    </div>
    {% endif %}
</section>
