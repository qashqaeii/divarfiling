{% load persian_tags %}
{% if announcements %}
<div class="mk-notices mk-notices--banner announcements-section" role="region" aria-label="اطلاعیه‌ها">
    <div class="mk-notices__inner">
        {% for announcement in announcements %}
        <div class="mk-notice mk-notice--promo mk-notice--banner announcement-bar" data-notice-kind="announcement" data-notice-id="{{ announcement.pk }}">
            <span class="mk-notice__badge" aria-hidden="true">
                <i class="fas fa-bullhorn"></i>
                <span class="mk-notice__badge-label">اطلاعیه</span>
            </span>
            <div class="mk-notice__body">
                <strong class="mk-notice__title announcement-title">{{ announcement.title }}</strong>
                <span class="mk-notice__text announcement-desc">{{ announcement.content|highlight_promo_codes }}</span>
            </div>
            {% if announcement.link %}
            <div class="mk-notice__actions">
                <a href="{{ announcement.link }}" class="mk-notice__cta announcement-bar-link">
                    <span>{{ announcement.link_text|default:"مشاهده" }}</span>
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                </a>
            </div>
            {% endif %}
            <button type="button" class="mk-notice__close announcement-bar-close" data-mk-notice-close onclick="closeAnnouncement(this)" aria-label="بستن اطلاعیه">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
