{% if breadcrumbs %}
<nav class="mk-platform-bc" aria-label="مسیر صفحه">
    <ol class="mk-platform-bc__list">
        {% for item in breadcrumbs %}
        <li class="mk-platform-bc__item{% if item.active %} is-active{% endif %}">
            {% if item.url and not item.active %}
            <a href="{{ item.url }}" class="mk-platform-bc__link">{{ item.name }}</a>
            {% else %}
            <span class="mk-platform-bc__current"{% if item.active %} aria-current="page"{% endif %}>{{ item.name }}</span>
            {% endif %}
            {% if not forloop.last %}
            <span class="mk-platform-bc__sep" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
