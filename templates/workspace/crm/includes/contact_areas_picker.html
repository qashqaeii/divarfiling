{# انتخاب محله/خیابان از فایلینگ و فایل شخصی + تگ دلخواه #}
<div class="crm-field crm-areas-field{% if wrapper_class %} {{ wrapper_class }}{% endif %}{% if field.errors %} crm-field-has-error{% endif %}"
     data-field="{{ field_name }}"
     data-crm-areas-picker
     data-field-name="{{ field_name }}"
     data-areas-search-url="{{ search_url }}"
     data-unit-label="{{ unit_label }}"
     data-empty-selected="{{ empty_selected }}">
    <div class="crm-areas-head">
        <label class="crm-label" id="crm-areas-label-{{ field_name }}">{{ label }}</label>
        <span class="crm-areas-count" data-crm-areas-count aria-live="polite">۰ {{ unit_label }}</span>
    </div>
    <p class="crm-form-hint crm-form-hint--tight">{{ hint }}</p>

    {{ field }}

    <div class="crm-areas-selected" data-crm-areas-selected aria-labelledby="crm-areas-label-{{ field_name }}"></div>

    <div class="crm-areas-toolbar">
        <div class="crm-areas-search-wrap">
            <input type="search"
                   class="crm-areas-search"
                   data-crm-areas-search
                   placeholder="{{ search_placeholder }}"
                   autocomplete="off"
                   aria-label="جستجوی {{ unit_label }}">
            <i class="fas fa-search" aria-hidden="true"></i>
        </div>
        <div class="crm-areas-custom">
            <input type="text"
                   class="crm-input crm-areas-custom-input"
                   data-crm-areas-custom-input
                   placeholder="{{ custom_placeholder }}"
                   aria-label="افزودن {{ unit_label }} دلخواه">
            <button type="button" class="crm-areas-custom-add" data-crm-areas-custom-add>
                <i class="fas fa-plus" aria-hidden="true"></i>
                افزودن
            </button>
        </div>
    </div>

    <div class="crm-areas-catalog-wrap">
        <div class="crm-areas-catalog" data-crm-areas-catalog role="group" aria-label="{{ catalog_aria }}"{% if not catalog_items %} hidden{% endif %}>
            {% for item in catalog_items %}
            <label class="crm-areas-option" data-crm-areas-option-wrap>
                <input type="checkbox" class="crm-areas-option-input" value="{{ item }}" data-crm-areas-option>
                <span class="crm-areas-option-text">{{ item }}</span>
            </label>
            {% endfor %}
        </div>
        {% if not catalog_items %}
        <p class="crm-areas-empty" data-crm-areas-empty>{{ empty_catalog }}</p>
        {% endif %}
    </div>

    {% for error in field.errors %}
    <p class="crm-field-error" role="alert">{{ error }}</p>
    {% endfor %}
</div>
