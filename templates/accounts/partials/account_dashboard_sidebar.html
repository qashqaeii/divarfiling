{% load account_avatar_tags %}
<aside class="mk-account-sidebar" id="accountSidebar" aria-label="منوی حساب کاربری">
    <button type="button" class="mk-account-sidebar__close" data-account-sidebar-close aria-label="بستن منو">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>

    <div class="mk-account-sidebar__user">
        <button type="button" class="mk-account-sidebar__avatar-btn" onclick="openAccountAvatarPicker()" aria-label="تغییر آواتار">
            <span class="mk-account-sidebar__avatar">
                <img id="accountAvatarSidebarImg" src="{% account_user_avatar_url user %}" alt="" width="48" height="48" loading="lazy" decoding="async">
            </span>
            <span class="mk-account-sidebar__avatar-edit" aria-hidden="true"><i class="fas fa-pen"></i></span>
        </button>
        <div class="mk-account-sidebar__user-copy">
            <strong class="mk-account-sidebar__user-name">{{ user.get_full_name|default:user.username }}</strong>
            <span class="mk-account-sidebar__user-meta">@{{ user.username }}</span>
            {% if user.phone %}<span class="mk-account-sidebar__user-meta" dir="ltr">{{ user.phone }}</span>{% endif %}
            <button type="button" class="mk-account-sidebar__avatar-link" onclick="openAccountAvatarPicker()">تغییر آواتار</button>
        </div>
    </div>

    <nav class="mk-account-sidebar__nav" aria-label="بخش‌های حساب">
        <a href="{{ dashboard_tab_urls.overview }}"
           class="mk-account-sidebar__link{% if active_tab == 'overview' %} is-active{% endif %}">
            <i class="fas fa-grip" aria-hidden="true"></i>
            <span>نمای کلی</span>
        </a>
        <a href="{{ dashboard_tab_urls.orders }}"
           class="mk-account-sidebar__link{% if active_tab == 'orders' %} is-active{% endif %}">
            <i class="fas fa-shopping-bag" aria-hidden="true"></i>
            <span>سفارش‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.licenses }}"
           class="mk-account-sidebar__link{% if active_tab == 'licenses' %} is-active{% endif %}">
            <i class="fas fa-key" aria-hidden="true"></i>
            <span>لایسنس‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.downloads }}"
           class="mk-account-sidebar__link{% if active_tab == 'downloads' %} is-active{% endif %}">
            <i class="fas fa-download" aria-hidden="true"></i>
            <span>دانلود اپ‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.transactions }}"
           class="mk-account-sidebar__link{% if active_tab == 'transactions' %} is-active{% endif %}">
            <i class="fas fa-right-left" aria-hidden="true"></i>
            <span>تراکنش‌ها</span>
        </a>
        {% if has_paid_orders %}
        <a href="{{ dashboard_tab_urls.affiliate }}"
           class="mk-account-sidebar__link{% if active_tab == 'affiliate' %} is-active{% endif %}">
            <i class="fas fa-handshake" aria-hidden="true"></i>
            <span>همکاری در فروش</span>
        </a>
        {% endif %}
        <a href="{{ dashboard_tab_urls.profile }}"
           class="mk-account-sidebar__link{% if active_tab == 'profile' %} is-active{% endif %}">
            <i class="fas fa-user-pen" aria-hidden="true"></i>
            <span>پروفایل</span>
        </a>
    </nav>

    <div class="mk-account-sidebar__foot">
        <a href="{% url 'home' %}" class="mk-account-sidebar__foot-link">
            <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
            <span>بازگشت به سایت</span>
        </a>
        <a href="{% url 'logout' %}" class="mk-account-sidebar__foot-link">
            <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i>
            <span>خروج از حساب</span>
        </a>
    </div>
</aside>
