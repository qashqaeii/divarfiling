<nav class="mk-account-tab-rail" aria-label="بخش‌های حساب">
    <div class="mk-account-tab-rail__track">
        <a href="{{ dashboard_tab_urls.overview }}"
           class="mk-account-tab-rail__item{% if active_tab == 'overview' %} is-active{% endif %}">
            <i class="fas fa-grip" aria-hidden="true"></i>
            <span>نمای کلی</span>
        </a>
        <a href="{{ dashboard_tab_urls.orders }}"
           class="mk-account-tab-rail__item{% if active_tab == 'orders' %} is-active{% endif %}">
            <i class="fas fa-shopping-bag" aria-hidden="true"></i>
            <span>سفارش‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.licenses }}"
           class="mk-account-tab-rail__item{% if active_tab == 'licenses' %} is-active{% endif %}">
            <i class="fas fa-key" aria-hidden="true"></i>
            <span>لایسنس‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.downloads }}"
           class="mk-account-tab-rail__item{% if active_tab == 'downloads' %} is-active{% endif %}">
            <i class="fas fa-download" aria-hidden="true"></i>
            <span>دانلود</span>
        </a>
        <a href="{{ dashboard_tab_urls.transactions }}"
           class="mk-account-tab-rail__item{% if active_tab == 'transactions' %} is-active{% endif %}">
            <i class="fas fa-right-left" aria-hidden="true"></i>
            <span>تراکنش‌ها</span>
        </a>
        {% if has_paid_orders %}
        <a href="{{ dashboard_tab_urls.affiliate }}"
           class="mk-account-tab-rail__item{% if active_tab == 'affiliate' %} is-active{% endif %}">
            <i class="fas fa-handshake" aria-hidden="true"></i>
            <span>همکاری</span>
        </a>
        {% endif %}
        <a href="{{ dashboard_tab_urls.profile }}"
           class="mk-account-tab-rail__item{% if active_tab == 'profile' %} is-active{% endif %}">
            <i class="fas fa-user-pen" aria-hidden="true"></i>
            <span>پروفایل</span>
        </a>
    </div>
</nav>
