<div class="fl-mob-filter-sheet__body ws-filing-hub-filter-body">
    <div class="fl-toolbar__filters fl-toolbar__filters--mob">
        <section class="fl-mob-filter-section" aria-labelledby="wsFilingFilterTx">
            <h3 class="fl-mob-filter-section__title" id="wsFilingFilterTx">نوع معامله</h3>
            <div class="fl-mob-filter-chips" data-fl-filter-sync="tx">
                <button type="button" class="fl-mob-filter-chip{% if not filters.tx %} is-active{% endif %}" data-value="">همه</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.tx == 'sale' %} is-active{% endif %}" data-value="sale">فروش</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.tx == 'rent' %} is-active{% endif %}" data-value="rent">اجاره</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.tx == 'mixed' %} is-active{% endif %}" data-value="mixed">ترکیبی</button>
            </div>
        </section>
        <section class="fl-mob-filter-section" aria-labelledby="wsFilingFilterCity">
            <h3 class="fl-mob-filter-section__title" id="wsFilingFilterCity">شهر</h3>
            <div class="fl-mob-filter-chips fl-mob-filter-chips--scroll" data-fl-filter-sync="city">
                <button type="button" class="fl-mob-filter-chip{% if not filters.city %} is-active{% endif %}" data-value="">همه</button>
                {% for c in cities %}
                <button type="button" class="fl-mob-filter-chip{% if filters.city == c %} is-active{% endif %}" data-value="{{ c }}">{{ c }}</button>
                {% endfor %}
            </div>
        </section>
        <section class="fl-mob-filter-section" aria-labelledby="wsFilingFilterFmt">
            <h3 class="fl-mob-filter-section__title" id="wsFilingFilterFmt">فرمت فایل</h3>
            <div class="fl-mob-filter-chips" data-fl-filter-sync="format">
                <button type="button" class="fl-mob-filter-chip{% if not filters.format %} is-active{% endif %}" data-value="">همه</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.format == 'xlsx' %} is-active{% endif %}" data-value="xlsx">Excel</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.format == 'csv' %} is-active{% endif %}" data-value="csv">CSV</button>
                <button type="button" class="fl-mob-filter-chip{% if filters.format == 'json' %} is-active{% endif %}" data-value="json">JSON</button>
            </div>
        </section>
    </div>
</div>

<footer class="fl-mob-filter-sheet__foot ws-filing-hub-filter-foot">
    {% if has_filters %}
    <a href="{% url 'workspace:dataset_list' %}{% if view_mode != 'auto' %}?view={{ view_mode }}{% endif %}" class="fl-mob-filter-sheet__clear">پاک کردن</a>
    {% else %}
    <button type="button" class="fl-mob-filter-sheet__clear" data-ws-filing-hub-filter-close>پاک کردن</button>
    {% endif %}
    <button type="submit" class="fl-mob-filter-sheet__apply">
        <i class="fas fa-check" aria-hidden="true"></i>
        <span>اعمال فیلترها</span>
    </button>
</footer>
