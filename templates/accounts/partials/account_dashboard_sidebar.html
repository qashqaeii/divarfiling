<aside class="mk-account-sidebar" id="accountSidebar" aria-label="منوی حساب کاربری" tabindex="-1">
    <button type="button" class="mk-account-sidebar__close" data-account-sidebar-close aria-label="بستن منوی حساب">
        <i class="fas fa-xmark" aria-hidden="true"></i>
    </button>

    <nav class="mk-account-sidebar__nav" aria-label="بخش‌های حساب">
        <a href="{{ dashboard_tab_urls.overview }}" class="mk-account-sidebar__link{% if active_tab == 'overview' %} is-active{% endif %}"{% if active_tab == 'overview' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-grip" aria-hidden="true"></i></span>
            <span>نمای کلی</span>
        </a>
        <a href="{{ dashboard_tab_urls.orders }}" class="mk-account-sidebar__link{% if active_tab == 'orders' %} is-active{% endif %}"{% if active_tab == 'orders' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-shopping-bag" aria-hidden="true"></i></span>
            <span>سفارش‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.licenses }}" class="mk-account-sidebar__link{% if active_tab == 'licenses' %} is-active{% endif %}"{% if active_tab == 'licenses' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-key" aria-hidden="true"></i></span>
            <span>لایسنس‌ها</span>
        </a>
        <a href="{{ dashboard_tab_urls.downloads }}" class="mk-account-sidebar__link{% if active_tab == 'downloads' %} is-active{% endif %}"{% if active_tab == 'downloads' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-download" aria-hidden="true"></i></span>
            <span>دانلود اپ‌ها</span>
        </a>

        <a href="{{ dashboard_tab_urls.transactions }}" class="mk-account-sidebar__link{% if active_tab == 'transactions' %} is-active{% endif %}"{% if active_tab == 'transactions' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-right-left" aria-hidden="true"></i></span>
            <span>تراکنش‌ها</span>
        </a>
        {% if has_paid_orders %}
        <a href="{{ dashboard_tab_urls.affiliate }}" class="mk-account-sidebar__link{% if active_tab == 'affiliate' %} is-active{% endif %}"{% if active_tab == 'affiliate' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-handshake" aria-hidden="true"></i></span>
            <span>همکاری در فروش</span>
        </a>
        {% endif %}

        <a href="{{ dashboard_tab_urls.profile }}" class="mk-account-sidebar__link{% if active_tab == 'profile' %} is-active{% endif %}"{% if active_tab == 'profile' %} aria-current="page"{% endif %}>
            <span class="mk-account-sidebar__link-icon"><i class="fas fa-user-pen" aria-hidden="true"></i></span>
            <span>پروفایل</span>
        </a>
    </nav>

    <div class="mk-account-sidebar__foot">
        <a href="{% url 'workspace:home' %}" class="mk-account-sidebar__workspace">
            <span class="mk-account-sidebar__workspace-copy">
                <span>ورود به میزکار</span>
                <small>مدیریت فایل‌ها و مشتریان</small>
            </span>
            <i class="fas fa-arrow-left mk-account-sidebar__workspace-arrow" aria-hidden="true"></i>
        </a>
        <div class="mk-account-sidebar__foot-links">
            <a href="{% url 'home' %}" class="mk-account-sidebar__foot-link">
                <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i><span>بازگشت به سایت</span>
            </a>
            <a href="{% url 'logout' %}" class="mk-account-sidebar__foot-link mk-account-sidebar__foot-link--logout">
                <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i><span>خروج از حساب</span>
            </a>
        </div>
    </div>
</aside>
