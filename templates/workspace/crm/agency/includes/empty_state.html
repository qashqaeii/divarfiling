<div class="agency-empty{% if compact %} agency-empty--compact{% endif %}{% if variant %} agency-empty--{{ variant }}{% endif %}">
    {% if icon %}
    <span class="agency-empty__icon" aria-hidden="true"><i class="fas fa-{{ icon }}"></i></span>
    {% endif %}
    <div class="agency-empty__body">
        <h3 class="agency-empty__title">{{ title }}</h3>
        {% if description %}<p class="agency-empty__desc">{{ description }}</p>{% endif %}
    </div>
    {% if action_url and action_label %}
    <div class="agency-empty__actions">
        <a href="{{ action_url }}" class="crm-btn crm-btn-primary crm-btn-sm">{{ action_label }}</a>
    </div>
    {% elif action_modal %}
    <div class="agency-empty__actions">
        <button type="button" class="crm-btn crm-btn-primary crm-btn-sm" data-bs-toggle="modal" data-bs-target="#agencyInviteModal">{{ action_modal }}</button>
    </div>
    {% endif %}
</div>
