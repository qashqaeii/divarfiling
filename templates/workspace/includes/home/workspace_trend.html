<section class="wsh-card wsh-trend mk-insight mk-insight--trend" data-trend-chart data-help-tour="workspace-trend" aria-label="روند فعالیت">
    <header class="wsh-card__head">
        <div class="wsh-card__title">
            <span class="wsh-card__icon" aria-hidden="true"><i class="fas fa-chart-line"></i></span>
            <div>
                <h2 id="hubTrendTitle">روند ۷ روز</h2>
                <span class="wsh-card__sub">مخاطب، ملک و معامله</span>
            </div>
        </div>
        <div class="wsh-trend__tools">
            <div class="wsh-trend__range" role="group" aria-label="بازه زمانی">
        <button type="button" class="wsh-trend__range-btn mk-insight-range-btn is-active" data-trend-range="7">۷ روز</button>
        <button type="button" class="wsh-trend__range-btn mk-insight-range-btn" data-trend-range="30">۳۰ روز</button>
            </div>
        </div>
    </header>
    <div class="wsh-trend__legend" id="hubTrendLegend" aria-hidden="true"></div>
    <div class="wsh-trend__chart">
        <canvas id="chart-activity" height="220" aria-label="نمودار روند فعالیت"></canvas>
    </div>
</section>
