{% load crm_tags %}
{% crm_contact_avatar_url contact as avatar_url %}
{% if avatar_url %}
<img class="{{ css_class }} {{ css_class }}--photo" src="{{ avatar_url }}" alt=""{% if width %} width="{{ width }}" height="{{ height }}"{% endif %} loading="{{ loading|default:'lazy' }}" decoding="async">
{% else %}
<span class="{{ css_class }} crm-deals-avatar crm-deals-avatar--hue-{{ contact.name|crm_avatar_hue }}" aria-hidden="true">{{ contact.name|crm_initials }}</span>
{% endif %}
