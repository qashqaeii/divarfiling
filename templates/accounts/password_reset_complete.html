{% extends 'base.html' %}

{% block title %}رمز تغییر کرد | میزکار{% endblock %}
{% block body_class %}mk-auth-page{% endblock %}

{% block content %}
<div class="mk-auth">
    <div class="mk-auth-visual">
        <div class="mk-auth-brand">
            <div class="mk-auth-brand-mark"><i class="fas fa-check" aria-hidden="true"></i></div>
            <h2>رمز با موفقیت تغییر کرد</h2>
        </div>
    </div>
    <div class="mk-auth-form-side">
        <div class="mk-auth-card" style="text-align:center">
            <div class="auth-header">
                <h1 class="auth-title">آماده ورود هستید</h1>
                <p class="auth-subtitle">اکنون می‌توانید با رمز جدید وارد شوید.</p>
            </div>
            <a href="{% url 'login' %}" class="auth-submit-btn" style="display:inline-block;text-decoration:none"><span>ورود به میزکار</span></a>
        </div>
    </div>
</div>
{% endblock %}
