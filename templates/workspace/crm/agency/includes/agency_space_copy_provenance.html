{% if agency_space_copy_provenance %}
<aside class="agency-space-provenance" aria-label="منبع فضای آژانس">
    <span class="agency-space-provenance__badge">فضای آژانس</span>
    {% if agency_space_copy_provenance.publisher_name %}
    <span class="agency-space-provenance__sep" aria-hidden="true"></span>
    <span class="agency-space-provenance__meta">
        <span class="agency-space-provenance__meta-label">منتشرکننده</span>
        <span class="agency-space-provenance__meta-name">{{ agency_space_copy_provenance.publisher_name }}</span>
    </span>
    {% endif %}
    {% if agency_space_copy_provenance.space_item_url %}
    <span class="agency-space-provenance__sep" aria-hidden="true"></span>
    <a class="agency-space-provenance__link" href="{{ agency_space_copy_provenance.space_item_url }}">
        مشاهده در فضا
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
    </a>
    {% endif %}
</aside>
{% endif %}
