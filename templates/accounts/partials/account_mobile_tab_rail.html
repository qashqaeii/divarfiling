<div class="mk-account-mob-shell">
    <header class="mk-account-mob-top">
        <div class="mk-account-mob-top__user">
            <span class="mk-account-mob-top__avatar" aria-hidden="true">
                {% if user.profile and user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" alt="">
                {% else %}
                <span>{{ user.username|slice:":1"|upper }}</span>
                {% endif %}
            </span>
            <div class="mk-account-mob-top__copy">
                <strong>{{ user.get_full_name|default:user.username }}</strong>
                <span>حساب کاربری · @{{ user.username }}</span>
            </div>
        </div>
        <div class="mk-account-mob-top__actions">
            <a href="{% url 'workspace:home' %}" class="mk-account-mob-icon-btn" title="میزکار" aria-label="میزکار">
                <i class="fas fa-layer-group" aria-hidden="true"></i>
            </a>
            <a href="{% url 'home' %}" class="mk-account-mob-icon-btn" title="بازگشت به سایت" aria-label="بازگشت به سایت">
                <i class="fas fa-house" aria-hidden="true"></i>
            </a>
            <a href="{% url 'logout' %}" class="mk-account-mob-icon-btn mk-account-mob-icon-btn--muted" title="خروج" aria-label="خروج از حساب">
                <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <nav class="mk-account-tab-rail" aria-label="بخش‌های حساب">
        <div class="mk-account-tab-rail__track" data-account-tab-track>
            <a href="{{ dashboard_tab_urls.overview }}"
               class="mk-account-tab-rail__item{% if active_tab == 'overview' %} is-active{% endif %}">
                <i class="fas fa-grip" aria-hidden="true"></i>
                <span>نمای کلی</span>
            </a>
            <a href="{{ dashboard_tab_urls.orders }}"
               class="mk-account-tab-rail__item{% if active_tab == 'orders' %} is-active{% endif %}">
                <i class="fas fa-shopping-bag" aria-hidden="true"></i>
                <span>سفارش‌ها</span>
            </a>
            <a href="{{ dashboard_tab_urls.licenses }}"
               class="mk-account-tab-rail__item{% if active_tab == 'licenses' %} is-active{% endif %}">
                <i class="fas fa-key" aria-hidden="true"></i>
                <span>لایسنس‌ها</span>
            </a>
            <a href="{{ dashboard_tab_urls.downloads }}"
               class="mk-account-tab-rail__item{% if active_tab == 'downloads' %} is-active{% endif %}">
                <i class="fas fa-download" aria-hidden="true"></i>
                <span>دانلود</span>
            </a>
            <a href="{{ dashboard_tab_urls.transactions }}"
               class="mk-account-tab-rail__item{% if active_tab == 'transactions' %} is-active{% endif %}">
                <i class="fas fa-right-left" aria-hidden="true"></i>
                <span>تراکنش‌ها</span>
            </a>
            {% if has_paid_orders %}
            <a href="{{ dashboard_tab_urls.affiliate }}"
               class="mk-account-tab-rail__item{% if active_tab == 'affiliate' %} is-active{% endif %}">
                <i class="fas fa-handshake" aria-hidden="true"></i>
                <span>همکاری</span>
            </a>
            {% endif %}
            <a href="{{ dashboard_tab_urls.profile }}"
               class="mk-account-tab-rail__item{% if active_tab == 'profile' %} is-active{% endif %}">
                <i class="fas fa-user-pen" aria-hidden="true"></i>
                <span>پروفایل</span>
            </a>
        </div>
    </nav>
</div>
