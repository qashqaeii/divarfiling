{% if feat.advertiser %}
<span class="mk-adv-tag {{ feat.advertiser.tag_class }}" title="{{ feat.advertiser.title }}">
    <span class="mk-adv-dot" aria-hidden="true"></span>
    <span class="mk-adv-label">{{ feat.advertiser.short_label }}</span>
</span>
{% elif feat.is_consultant %}
<span class="mk-adv-tag mk-adv-tag--consultant" title="مشاور املاک">
    <span class="mk-adv-dot" aria-hidden="true"></span>
    <span class="mk-adv-label">مشاور</span>
</span>
{% else %}
<span class="mk-adv-tag mk-adv-tag--personal" title="آگهی شخصی">
    <span class="mk-adv-dot" aria-hidden="true"></span>
    <span class="mk-adv-label">شخصی</span>
</span>
{% endif %}
