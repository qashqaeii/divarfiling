{% if not customer_is_shared %}
<div class="crm-detail-actions" role="toolbar" aria-label="عملیات مخاطب">
    {% if customer.phone %}
    <a href="https://wa.me/98{{ customer.phone|slice:'1:' }}" target="_blank" class="mk-hero-btn mk-hero-btn-accent" title="واتساپ"><i class="fas fa-comment-dots" aria-hidden="true"></i></a>
    <button type="button" class="mk-hero-btn mk-hero-btn-ghost" data-copy="{{ whatsapp_text }}" title="قالب پیام"><i class="fas fa-comment-dots" aria-hidden="true"></i><span>قالب</span></button>
    <a href="tel:{{ customer.phone }}" class="mk-hero-btn mk-hero-btn-ghost" title="تماس"><i class="fas fa-phone" aria-hidden="true"></i></a>
    <form method="post" class="mk-inline-form" title="ثبت تماس">
        {% csrf_token %}
        <input type="hidden" name="action" value="log_call">
        <button type="submit" class="mk-hero-btn mk-hero-btn-ghost"><i class="fas fa-phone-volume"></i><span>تماس گرفتم</span></button>
    </form>
    {% endif %}
    {% if ai_enabled and has_bot_license %}
    <button type="button" class="mk-hero-btn mk-hero-btn-accent" data-drawer-open="drawer-ai-message" title="پیام هوشمند">
        <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i><span>پیام هوشمند</span>
    </button>
    {% endif %}
    <button type="button" class="mk-hero-btn mk-hero-btn-ghost" data-drawer-open="drawer-activity"><i class="fas fa-plus" aria-hidden="true"></i><span>فعالیت</span></button>
    <button type="button" class="mk-hero-btn mk-hero-btn-primary" data-drawer-open="drawer-edit"><i class="fas fa-pen" aria-hidden="true"></i><span>ویرایش</span></button>
</div>
{% endif %}
