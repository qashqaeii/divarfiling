<header class="acd-lesson-head">
    {% if back_url %}
    <a href="{{ back_url }}" class="acd-head-back">
        <i class="fas fa-arrow-right" aria-hidden="true"></i>
        <span>{{ back_label }}</span>
    </a>
    {% endif %}
    <div class="acd-lesson-head-body">
        <h1 class="acd-lesson-title">{{ title }}</h1>
        {% if desc %}
        <p class="acd-lesson-desc">{{ desc }}</p>
        {% endif %}
    </div>
</header>
