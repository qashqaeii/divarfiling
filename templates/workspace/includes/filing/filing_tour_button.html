<button type="button" class="fl-header__tour{% if mobile %} fl-mob-header__icon fl-mob-header__icon--tour{% endif %}" data-fl-tour-start title="تور آموزشی فایلینگ" aria-label="تور آموزشی فایلینگ" data-fl-tour="{% if tour_attr %}{{ tour_attr }}{% else %}filing-tour-btn{% endif %}">
    <span class="fl-header__tour-ring" aria-hidden="true"></span>
    <span class="fl-header__tour-icon" aria-hidden="true">
        <i class="fas fa-compass"></i>
        <span class="fl-header__tour-glow"></span>
    </span>
    {% if show_tour_label %}<span class="fl-header__tour-label">تور</span>{% endif %}
</button>
